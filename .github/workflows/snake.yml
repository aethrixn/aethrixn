name: Generate contribution signal

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Render animated contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%23007F75&color_dots=%23EBEFF3,%23BFF5EF,%2375E8DC,%2326CDBB,%2300EAD0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2300EAD0&color_dots=%230B1119,%23003B36,%23007F75,%2300BDAA,%2300EAD0

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: "chore: refresh contribution signal"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
