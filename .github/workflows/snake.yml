name: Generate contribution signal

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Render animated contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%23FF7A3D&color_dots=%23EBEDF0,%23B8E7F3,%235DE0FF,%232C8DB5,%230D5A78
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FF9B55&color_dots=%23121A27,%23263B58,%232C8DB5,%235DE0FF,%23D8F7FF

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: "chore: refresh contribution signal"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

