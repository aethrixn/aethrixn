name: Generate contribution signal

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Render animated contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%23000000&color_dots=%23F3F3F3,%23D8D8D8,%23A8A8A8,%236C6C6C,%23222222
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FFFFFF&color_dots=%23050505,%23262626,%23515151,%23949494,%23ECECEC

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: "chore: refresh contribution signal"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

