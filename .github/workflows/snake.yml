name: Generate contribution signal

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Render animated contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%230C4F63&color_dots=%23EBEFF3,%23BFE7F2,%2380D2E8,%234FC0DE,%2339D7FF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2339D7FF&color_dots=%230B1119,%230C4F63,%23177E9B,%2325B4DC,%2339D7FF

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: "chore: refresh contribution signal"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
