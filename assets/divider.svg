<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-labelledby="dv-t dv-d" preserveAspectRatio="xMidYMid meet">
  <title id="dv-t">Animated section divider</title>
  <desc id="dv-d">A hairline rule with a light pulse travelling across it.</desc>
  <defs>
    <linearGradient id="dv-line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#18222E" stop-opacity="0"/><stop offset=".12" stop-color="#26343F"/>
      <stop offset=".88" stop-color="#26343F"/><stop offset="1" stop-color="#18222E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dv-pulse" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#39D7FF" stop-opacity="0"/><stop offset=".5" stop-color="#39D7FF"/><stop offset="1" stop-color="#39D7FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="dv-glow" x="-50%" y="-400%" width="200%" height="900%"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>
  <rect x="0" y="14" width="1200" height="1" fill="url(#dv-line)"/>
  <rect y="13.5" width="220" height="2" fill="url(#dv-pulse)" filter="url(#dv-glow)" opacity=".9">
    <animate attributeName="x" values="-240;1200" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect y="13.5" width="220" height="2" fill="url(#dv-pulse)" opacity=".95">
    <animate attributeName="x" values="-240;1200" dur="6s" repeatCount="indefinite"/>
  </rect>
  <g fill="#0C4F63">
    <rect x="596" y="11" width="8" height="8" rx="1.6" transform="rotate(45 600 14)"/>
  </g>
</svg>