
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Aethrixn selected work — animated monochrome product index</title>
  <desc id="desc">A black-and-white editorial map connecting Buildary, Spatial AI, Visual Commerce and Research Agents.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030303"/><stop offset="1" stop-color="#0D0D0D"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="a" d="M600 260C514 236 454 183 391 154"/>
    <path id="b" d="M600 260C686 236 746 183 809 154"/>
    <path id="c" d="M600 260C514 286 454 337 391 366"/>
    <path id="d" d="M600 260C686 286 746 337 809 366"/>
  </defs>
  <rect x="1" y="1" width="1198" height="518" rx="24" fill="url(#paper)"/>
  <rect x="1" y="1" width="1198" height="518" rx="24" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="517" rx="23" fill="none" stroke="#404040"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="38" y="43" fill="#EDEDED" font-size="12" font-weight="800" letter-spacing="3.8">SELECTED WORK / PRODUCT INDEX</text>
    <text x="1162" y="43" text-anchor="end" fill="#777777" font-size="11" font-weight="800" letter-spacing="2.8">AETHRIX ATELIER — 2026</text>
    <line x1="38" y1="62" x2="1162" y2="62" stroke="#323232"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="1" stroke-dasharray="4 7"><use href="#a"/><use href="#b"/><use href="#c"/><use href="#d"/></g>
  <g fill="#FFFFFF" filter="url(#glow)">
    <circle r="3"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#a"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath href="#b"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="5.5s" begin="-3.4s" repeatCount="indefinite"><mpath href="#c"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="6.4s" begin="-1.2s" repeatCount="indefinite"><mpath href="#d"/></animateMotion></circle>
  </g>
  <g transform="translate(600 260)">
    <circle r="58" fill="#050505" stroke="#BDBDBD"/>
    <circle r="45" fill="none" stroke="#505050" stroke-dasharray="7 9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/></circle>
    <text text-anchor="middle" y="-3" fill="#FFFFFF" font-family="Inter, ui-sans-serif, sans-serif" font-size="18" font-weight="900" letter-spacing="3">AETHRIX</text>
    <text text-anchor="middle" y="19" fill="#8A8A8A" font-family="Inter, ui-sans-serif, sans-serif" font-size="9" font-weight="800" letter-spacing="2">PRODUCT ATELIER</text>
  </g>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(38 88)">
      <rect width="396" height="132" rx="12" fill="#070707" stroke="#3A3A3A"/>
      <text x="22" y="41" fill="#FFFFFF" fill-opacity=".13" font-size="48" font-weight="900">01</text><text x="103" y="34" fill="#8A8A8A" font-size="10" font-weight="800" letter-spacing="2.5">OPEN-SOURCE FLAGSHIP</text>
      <text x="103" y="65" fill="#FFFFFF" font-size="25" font-weight="850" letter-spacing="1">BUILDARY</text><text x="103" y="91" fill="#B7B7B7" font-size="13">AI-native web creation.</text><text x="103" y="112" fill="#686868" font-size="11.5">Describe → construct → inspect → ship.</text>
    </g>
    <g transform="translate(766 88)">
      <rect width="396" height="132" rx="12" fill="#070707" stroke="#3A3A3A"/>
      <text x="22" y="41" fill="#FFFFFF" fill-opacity=".13" font-size="48" font-weight="900">02</text><text x="103" y="34" fill="#8A8A8A" font-size="10" font-weight="800" letter-spacing="2.5">SPACE / IMAGE</text>
      <text x="103" y="65" fill="#FFFFFF" font-size="25" font-weight="850" letter-spacing="1">SPATIAL AI</text><text x="103" y="91" fill="#B7B7B7" font-size="13">Rooms reimagined from one frame.</text><text x="103" y="112" fill="#686868" font-size="11.5">Image → redesign → decision.</text>
    </g>
    <g transform="translate(38 300)">
      <rect width="396" height="132" rx="12" fill="#070707" stroke="#3A3A3A"/>
      <text x="22" y="41" fill="#FFFFFF" fill-opacity=".13" font-size="48" font-weight="900">03</text><text x="103" y="34" fill="#8A8A8A" font-size="10" font-weight="800" letter-spacing="2.5">AUTOMOTIVE / STUDIO</text>
      <text x="103" y="65" fill="#FFFFFF" font-size="23" font-weight="850" letter-spacing=".5">VISUAL COMMERCE</text><text x="103" y="91" fill="#B7B7B7" font-size="13">Better worlds for real subjects.</text><text x="103" y="112" fill="#686868" font-size="11.5">Preserve object → transform context.</text>
    </g>
    <g transform="translate(766 300)">
      <rect width="396" height="132" rx="12" fill="#070707" stroke="#3A3A3A"/>
      <text x="22" y="41" fill="#FFFFFF" fill-opacity=".13" font-size="48" font-weight="900">04</text><text x="103" y="34" fill="#8A8A8A" font-size="10" font-weight="800" letter-spacing="2.5">KNOWLEDGE SYSTEMS</text>
      <text x="103" y="65" fill="#FFFFFF" font-size="23" font-weight="850" letter-spacing=".5">RESEARCH AGENTS</text><text x="103" y="91" fill="#B7B7B7" font-size="13">Evidence into long-form thinking.</text><text x="103" y="112" fill="#686868" font-size="11.5">Research → structure → argument.</text>
    </g>
  </g>
  <path d="M38 482H1162" stroke="#303030"/>
  <path d="M38 482H1162" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="120 1004"><animate attributeName="stroke-dashoffset" values="0;-1124" dur="8s" repeatCount="indefinite"/></path>
  <text x="38" y="502" fill="#686868" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="2">BUILD THE INTERACTION / HARDEN THE SYSTEM / SHIP THE LOOP</text>
</svg>
